name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies (per-package, no shared resolution)
        run: |
          dart pub get
          for pkg in packages/*; do
            (cd "$pkg" && dart pub get) || exit 1
          done
          (cd apps/player && flutter pub get)

      - name: Code generation (drift + l10n)
        working-directory: apps/player
        run: |
          dart run build_runner build
          flutter gen-l10n

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Static analysis
        run: flutter analyze

      - name: Test pure Dart packages
        run: |
          for pkg in packages/*; do
            echo "== $pkg =="
            (cd "$pkg" && dart test) || exit 1
          done

      - name: Test app
        working-directory: apps/player
        run: flutter test
