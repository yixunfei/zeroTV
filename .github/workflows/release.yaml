name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    name: Android (per-ABI APKs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies (per-package, no shared resolution)
        run: |
          dart pub get
          for pkg in packages/*; do
            (cd "$pkg" && dart pub get) || exit 1
          done
          (cd apps/player && flutter pub get)

      - name: Code generation (drift + l10n)
        working-directory: apps/player
        run: |
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n

      - name: Build release APKs (per-ABI + universal)
        working-directory: apps/player
        env:
          ZEROTV_KEYSTORE_B64: ${{ secrets.ZEROTV_KEYSTORE_B64 }}
          ZEROTV_KEYSTORE_PASSWORD: ${{ secrets.ZEROTV_KEYSTORE_PASSWORD }}
          ZEROTV_KEY_ALIAS: ${{ secrets.ZEROTV_KEY_ALIAS }}
          ZEROTV_KEY_PASSWORD: ${{ secrets.ZEROTV_KEY_PASSWORD }}
        run: |
          if [ -n "$ZEROTV_KEYSTORE_B64" ]; then
            echo "Release signing material present; building signed APKs."
          else
            echo "::warning::ZEROTV_KEYSTORE_B64 not set; APKs will use debug signing."
          fi
          flutter build apk --release --split-per-abi
          flutter build apk --release

      - name: Rename and hash artifacts
        working-directory: apps/player/build/app/outputs/flutter-apk
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          mkdir -p "$RUNNER_TEMP/out"
          cp app-armeabi-v7a-release.apk "zerotv-$VERSION-android-armeabi-v7a.apk"
          cp app-arm64-v8a-release.apk "zerotv-$VERSION-android-arm64-v8a.apk"
          cp app-x86_64-release.apk "zerotv-$VERSION-android-x86_64.apk"
          cp app-release.apk "zerotv-$VERSION-android-universal.apk"
          sha256sum zerotv-*.apk > SHA256SUMS-android.txt
          cp zerotv-*.apk SHA256SUMS-android.txt "$RUNNER_TEMP/out/"

      - uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: |
            ${{ runner.temp }}/out/*.apk
            ${{ runner.temp }}/out/SHA256SUMS-android.txt
          retention-days: 7

  build-windows:
    name: Windows (portable zip)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies (per-package, no shared resolution)
        shell: pwsh
        run: |
          dart pub get
          foreach ($pkg in Get-ChildItem packages -Directory) {
            Push-Location $pkg.FullName
            try { dart pub get; if ($LASTEXITCODE -ne 0) { exit 1 } } finally { Pop-Location }
          }
          Push-Location apps/player
          try { flutter pub get; if ($LASTEXITCODE -ne 0) { exit 1 } } finally { Pop-Location }

      - name: Code generation (drift + l10n)
        working-directory: apps/player
        run: |
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n

      - name: Build Windows release
        working-directory: apps/player
        run: flutter build windows --release

      - name: Package portable zip and hash artifacts
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}".TrimStart('v')
          $src = "apps/player/build/windows/x64/runner/Release"
          if (-not (Test-Path "$src/zerotv_player.exe")) {
            Write-Error "Expected exe not found: $src/zerotv_player.exe"
            exit 1
          }
          $staging = "${env:RUNNER_TEMP}/zerotv-$version-windows-x64"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item "$src/*" $staging -Recurse
          Compress-Archive -Path "$staging" -DestinationPath "${env:RUNNER_TEMP}/zerotv-$version-windows-x64.zip" -Force
          $hashes = Get-FileHash "${env:RUNNER_TEMP}/zerotv-$version-windows-x64.zip" -Algorithm SHA256
          "{0}  zerotv-$version-windows-x64.zip" -f $hashes.Hash.ToLower() |
            Out-File -Encoding ascii "${env:RUNNER_TEMP}/SHA256SUMS-windows.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            ${{ runner.temp }}/zerotv-*.zip
            ${{ runner.temp }}/SHA256SUMS-windows.txt
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Merge checksums
        run: cat artifacts/SHA256SUMS-*.txt > artifacts/SHA256SUMS.txt

      - name: Clean per-platform checksum files
        run: rm artifacts/SHA256SUMS-android.txt artifacts/SHA256SUMS-windows.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/*.apk
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
