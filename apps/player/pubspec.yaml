name: zerotv_player
description: zeroTV - open-source cross-platform IPTV player.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.12.0
  flutter: ^3.44.0

dependencies:
  drift: ^2.35.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  iptv_core:
    path: ../../packages/iptv_core
  path: ^1.9.1
  path_provider: ^2.1.6
  sqlite3_flutter_libs: ^0.6.0+eol

dev_dependencies:
  build_runner: ^2.15.1
  drift_dev: ^2.35.0
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.3.0

# material_ui/cupertino_ui 1.3.0/1.1.0 (pulled by go_router 18) use
# `@awaitNotRequired`, which this SDK's foundation.dart (Flutter 3.44.1)
# does not re-export yet. Pin to versions compatible with the SDK.
dependency_overrides:
  cupertino_ui: 1.0.2
  material_ui: 1.2.0

flutter:
  uses-material-design: true
